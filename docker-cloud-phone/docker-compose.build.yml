# 本地构建镜像（context 为仓库根目录，当前机器架构）
# Linux 默认 host 网络；Mac/Windows 叠加 docker-compose.bridge.yml
# 多架构请用 build-multiarch.sh
# 用法:
#   ./compose.sh -f docker-compose.build.yml up -d --build
#   docker compose -f docker-compose.build.yml --env-file ../.env up -d --build
name: cloud-phone

services:
  backend:
    build:
      context: ..
      dockerfile: docker-cloud-phone/docker/backend.Dockerfile
    image: ${DOCKERHUB_NAMESPACE:-yiyifred}/cloud-phone-backend:${IMAGE_TAG:-latest}
    network_mode: host
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      CLOUD_PHONE_USE_HOST_NETWORK: "1"
      CLOUD_PHONE_PREFER_SYSTEM_ADB: "1"
      CLOUD_PHONE_DATA_DIR: /data
    volumes:
      - ./data:/data
    # 与 docker-compose.yml 对齐：容器内已是 uid 10001，禁止提权程序获得新权限
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker-cloud-phone/docker/frontend.Dockerfile
    image: ${DOCKERHUB_NAMESPACE:-yiyifred}/cloud-phone-frontend:${IMAGE_TAG:-latest}
    network_mode: host
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      BACKEND_ORIGIN: http://127.0.0.1:${BACKEND_PORT:-3000}
      CLOUD_PHONE_USE_HOST_NETWORK: "1"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - backend
    restart: unless-stopped